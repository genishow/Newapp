name: Kinbir

options:
  bundleIdPrefix: com.geni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Kinbir:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geni.kinbir
        PRODUCT_NAME: Kinbir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Kinbir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Kinbir records a short video of you reading a script, so it can create your own voice.
        NSMicrophoneUsageDescription: Kinbir records your voice to create your own voice, and to turn what you say into a script.

  KinbirTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kinbir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geni.kinbir.tests
        GENERATE_INFOPLIST_FILE: YES

  KinbirUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kinbir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geni.kinbir.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kinbir

schemes:
  Kinbir:
    build:
      targets:
        Kinbir: all
    test:
      targets:
        - KinbirTests
    archive:
      config: Release
  KinbirUITests:
    build:
      targets:
        Kinbir: all
        KinbirUITests: [test]
    test:
      targets:
        - KinbirUITests
