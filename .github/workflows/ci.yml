# Every push: builds an unsigned Kinbir.ipa and attaches it to the run (about 3 Mac minutes).
# The tests are the expensive part (about 17 Mac minutes, and GitHub counts each Mac minute
# as 10 against the free allowance). They run when this workflow is started by hand from
# the Actions tab with "Run workflow", and on every push while the repository is public,
# where minutes are free:
#   - unit tests on the simulator
#   - end-to-end UI tests on the simulator (the app's built-in mock server)
# A second, small job checks the real Kinbir server still answers in the shape the app expects.
# The .ipa is unsigned. SideStore signs it with your free Apple ID when you install it.
name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A new push waits for the running build to finish, so no result is thrown away.
  cancel-in-progress: false

jobs:
  build-ipa-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Kinbir.xcodeproj \
            -scheme Kinbir \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kinbir.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | xcbeautify || (grep -E "error:|warning: unre" build.log | head -80; tail -120 build.log; exit 1)

      - name: Package Kinbir.ipa
        run: |
          APP=build/Kinbir.xcarchive/Products/Applications/Kinbir.app
          test -d "$APP" || { echo "::error::Kinbir.app not found in archive"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Kinbir.ipa Payload)
          ls -lh build/Kinbir.ipa

      - name: Upload Kinbir.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kinbir-build-${{ github.run_number }}
          path: build/Kinbir.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Pick a simulator
        if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Run unit tests on simulator
        if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kinbir.xcodeproj \
            -scheme Kinbir \
            -destination "id=$SIM_UDID" \
            | tee test.log | xcbeautify || (grep -E "error:|failed" test.log | head -80; tail -120 test.log; exit 1)

      - name: Run end-to-end UI tests on simulator
        if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kinbir.xcodeproj \
            -scheme KinbirUITests \
            -destination "id=$SIM_UDID" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/ui-tests.xcresult \
            | tee uitest.log | xcbeautify || (grep -E "error:|failed|did not appear|never showed" uitest.log | head -80; tail -150 uitest.log; exit 1)

      - name: Save screenshots of every screen
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false)
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/screenshots || true
          ls build/screenshots | head -50

      - name: Upload screenshots
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep UI test results if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ github.run_number }}
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Last, so the reason is the first thing seen at the end of the log.
      - name: Say which end-to-end test failed and why
        if: failure()
        run: |
          grep -E "error:|Test Case .* failed|did not appear|never showed|XCTAssert" uitest.log | tail -30 || true
          # The steps just before each failure, to see what the test did last.
          grep -n -B25 -E "did not appear|never showed" uitest.log | grep -E "t = |did not appear|never showed" | tail -60 || true
          # What was on screen when it failed: the identifiers and labels in view.
          for f in build/screenshots/*.txt; do
            if head -c 200 "$f" | grep -q "Attributes: Application"; then
              echo "== screen at failure: $f"
              grep -oE "identifier: '[^']+'|label: '[^']{1,60}'" "$f" | head -80
            fi
          done 2>/dev/null || true

  live-server-check:
    # Free, public endpoints only. Never signs in, never spends credits.
    # A failure here is a warning about the server, not about this build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check the real Kinbir server
        run: python3 scripts/live_smoke.py
