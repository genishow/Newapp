# OPTIONAL, for later. Needs the $99/year Apple Developer Program and the 8 secrets in
# docs/setup-guide.md (Later: TestFlight). It never runs by itself: start it by hand from the
# Actions tab. Until then, use the free SideStore path and the .ipa from the CI workflow.
# When ready, a `push: tags: ["v*"]` trigger can be added back so version tags upload automatically.
name: TestFlight (optional, paid)

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret: $name"; missing=1; fi
          done
          if [ $missing = 1 ]; then
            echo "::error::TestFlight needs the paid Apple Developer account. See docs/setup-guide.md, section 'Later: TestFlight'."
          fi
          exit $missing

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Keep build logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/gym/
          if-no-files-found: ignore
